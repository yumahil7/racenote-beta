<script>
const $=s=>document.querySelector(s);let D;const FK='rn_fav',AK='rn_age19';
const fav=()=>JSON.parse(localStorage.getItem(FK)||'[]');
function toggleFav(no){let f=fav();f=f.includes(no)?f.filter(x=>x!==no):[...f,no];localStorage.setItem(FK,JSON.stringify(f));route()}
const fd=d=>`${+String(d).slice(4,6)}/${+String(d).slice(6)}`;
const sec=t=>{const[m,s]=String(t).split(':');return s===undefined?+m:+m*60+ +s};
const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n};
const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
const dayShort=d=>String(d||'').replace('요일','');
let SI={},HSI={};
// ---- 데이터 정규화: 실데이터(kra.json) 또는 예시(sample.json)를 같은 구조로 ----
function normKra(k){
  const E=k.entries.map(e=>({...e,hrNo:String(e.hrNo),jkNo:String(e.jkNo),trNo:String(e.trNo),meet:e.meet,rcDate:String(e.rcDate),rcNo:String(e.rcNo),chulNo:String(e.chulNo),rcDay:dayShort(e.rcDay),
    age:String(e.age).includes('세')?e.age:e.age+'세',stTime:(String(e.stTime).match(/\d{1,2}:\d{2}/)||[''])[0],rating:e.rating,rcDist:String(e.rcDist)}));
  const dist={};E.forEach(e=>dist[[e.rcDate,e.meet,e.rcNo].join('|')]=e.rcDist);
  const trk={};(k.track||[]).forEach(t=>trk[[t.rcDate,t.meet,t.rcNo].join('|')]=t);
  const R=(k.detail||[]).filter(r=>+r.stOrd>0&&/\d/.test(r.rcTime)).map(r=>{const key=[r.rcDate,r.meet,r.rcNo].join('|');const t=trk[key]||{};
    return {meet:r.meet,rcDate:String(r.rcDate),rcNo:String(r.rcNo),rcDist:dist[key]||'',track:t.track||'-',water:t.waterPercent,ord:String(r.stOrd),chulNo:String(r.chulNo),
      hrNo:String(r.hrNo),hrName:r.hrName,age:r.age,sex:r.sex,wgBudam:r.wgBudam,jkNo:String(r.jkNo),jkName:r.jkName,trNo:r.trNo,trName:r.trName,wgHr:`${r.wgHr}(${+r.df>0?'+':''}${r.df})`,wgNum:+r.wgHr,df:+r.df,rcTime:r.rcTime,hrTool:r.hrTool||'-'}}).filter(r=>r.rcDist);
  const H={};E.forEach(e=>H[e.hrNo]={hrNo:e.hrNo,hrName:e.hrName,prdCtyNm:e.prd,sex:e.sex,age:e.age,owName:e.owName});
  const jk={};(k.jockeyPeriod||[]).forEach(j=>jk[j.jkNo]={win:+j.winRateTsum,qu:+j.quRateTsum,n:+j.raceCnttsum,src:'최근60일'});
  (k.jockeyResult||[]).forEach(j=>{if(!jk[j.jkNo]&&+j.rcCntY>0)jk[j.jkNo]={win:+j.winRateY,qu:+j.qnlRateY,n:+j.rcCntY,src:'최근1년'}});
  const wt={};(k.weight||[]).forEach(w=>wt[[w.rcDate,w.meet,w.rcNo,w.chulNo].join('|')]={wg:w.wgHr,diff:+w.wgHrDiff,recent:w.recentRcDate});
  const chg={};(k.jockeyChange||[]).forEach(c=>chg[[c.rcDate,c.meet,c.rcNo,c.chulNo].join('|')]=c);
  const jinfo={};(k.jockeys||[]).forEach(j=>jinfo[j.jkNo]=j);const jres={};(k.jockeyResult||[]).forEach(j=>jres[j.jkNo]=j);const jper={};(k.jockeyPeriod||[]).forEach(j=>jper[j.jkNo]=j);
  return {source:'kra',updatedAt:k.updatedAt,entries:E,results:R,horses:Object.values(H),jk,wt,chg,jinfo,jres,jper}}
function normSample(s){return {...s,source:'sample',jk:{},wt:{},chg:{},jinfo:{},jres:{},jper:{}}}
function calc(){const g={};D.results.forEach(r=>{const k=r.meet+r.rcDist;(g[k]=g[k]||[]).push(sec(r.rcTime))});
const st={};for(const k in g){const a=g[k],m=a.reduce((x,y)=>x+y)/a.length,sd=Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)||1;st[k]=[m,sd]}
D.results.forEach(r=>{const[m,sd]=st[r.meet+r.rcDist];const adj=['포화','불량'].includes(r.track)?.4:0;r.si=Math.round(80+(m-sec(r.rcTime)+adj)/sd*10)});
const by={};D.results.forEach(r=>(by[r.hrNo]=by[r.hrNo]||[]).push(r));
for(const h in by){by[h].sort((a,b)=>b.rcDate.localeCompare(a.rcDate));HSI[h]=Math.max(...by[h].slice(0,3).map(r=>r.si))}SI=by;
// 게이트 경향: 경마장별 1착마 중 안쪽(1~4번) 비율
D.gate={};const cnt={};D.results.forEach(r=>{if(r.ord==='1'){const c=cnt[r.meet]=cnt[r.meet]||{w:0,i:0};c.w++;if(+r.chulNo<=4)c.i++}});
for(const m in cnt)D.gate[m]=cnt[m].i/cnt[m].w}
const races=()=>{const m={};D.entries.forEach(e=>{const k=[e.rcDate,e.meet,e.rcNo].join('|');(m[k]=m[k]||[]).push(e)});for(const k in m)m[k].sort((a,b)=>a.chulNo-b.chulNo);return m};

const W={S:30,R:15,D:10,P:5,J:10,C:5,T:5,W:10,G:10};

function rate(rs,f){const n=rs.length,k=rs.filter(f).length;return{n,k,r:(k+0.9)/(n+3)}}
function rnScore(e,field){const hist=(SI[e.hrNo]||[]).filter(r=>r.rcDate<e.rcDate);const c={},ev={},flags=[];
 const l3=hist.slice(0,3);if(l3.length){const w=[.5,.3,.2].slice(0,l3.length),ws=w.reduce((a,b)=>a+b);const v=l3.reduce((a,r,i)=>a+r.si*w[i],0)/ws;c.S=clamp(50+(v-80)*2.5);ev.S=`최근 ${l3.length}회 지수 ${l3.map(r=>r.si).join('/')}`}else{c.S=50;ev.S='이전 기록 없음(중립 50)'}
 const rt=num(e.rating),avg=field.map(x=>num(x.rating)).filter(x=>x!==null);let R=50,rv=[];
 if(rt!==null&&avg.length){const a=avg.reduce((x,y)=>x+y)/avg.length;R+= (rt-a)*2;rv.push(`레이팅 ${rt} (경주 평균 ${a.toFixed(0)})`)}else rv.push('레이팅 없음');
 if(l3[0]&&num(e.wgBudam)!==null&&num(l3[0].wgBudam)!==null){const d=num(e.wgBudam)-num(l3[0].wgBudam);R-=d*2;rv.push(`부담중량 ${d>=0?'+':''}${d}kg`)}
 c.R=clamp(R);ev.R=rv.join(', ');
 const sd=hist.filter(r=>Math.abs(+r.rcDist-+e.rcDist)<=200);const dr=rate(sd,r=>+r.ord<=3);c.D=clamp(dr.r/0.6*100);ev.D=`비슷한 거리(±200m) ${dr.n}전 중 3착 이내 ${dr.k}회`;
 c.P=50;ev.P='혈통 데이터 미연동(중립 50)';
 const j=D.jk[e.jkNo];if(j){c.J=clamp(20+j.win*2+j.qu*0.6);ev.J=`${e.jkName} ${j.src} 승률 ${j.win}% · 복승률 ${j.qu}% (${j.n}전)`}else{c.J=50;ev.J='기수 성적 데이터 없음(중립 50)'}
 const cb=hist.filter(r=>r.jkNo&&r.jkNo===e.jkNo);if(cb.length>=3){const x=rate(cb,r=>+r.ord<=3);c.C=clamp(x.r/0.6*100);ev.C=`이 기수와 ${x.n}전 3착 이내 ${x.k}회`}else{c.C=50;ev.C=`조합 표본 ${cb.length}회(<3, 중립 50)`}
 const tr=D.results.filter(r=>r.trNo&&r.trNo===e.trNo&&r.rcDate<e.rcDate);if(tr.length>=5){const x=rate(tr,r=>+r.ord<=3);c.T=clamp(x.r/0.6*100);ev.T=`수집 기간 ${x.n}전 3착 이내 ${x.k}회(자체 집계)`}else{c.T=50;ev.T='표본 부족(중립 50)'}
 const w=D.wt[[e.rcDate,e.meet,e.rcNo,e.chulNo].join('|')];let Wc=65,wv=[];
 if(w){const a=Math.abs(w.diff);Wc=a>=10?35:a>=6?55:70;wv.push(`마체중 ${w.wg}kg (${w.diff>0?'+':''}${w.diff})`);if(a>=10)flags.push('마체중 ±10kg 이상')}else wv.push('마체중 정보 없음');
 if(l3[0]){const gap=(new Date(e.rcDate.replace(/(\d{4})(\d\d)(\d\d)/,'$1-$2-$3'))-new Date(l3[0].rcDate.replace(/(\d{4})(\d\d)(\d\d)/,'$1-$2-$3')))/864e5;if(gap>90){Wc-=20;flags.push(`휴양 후 복귀(${gap|0}일)`)}wv.push(`직전 출전 ${gap|0}일 전`)}
 c.W=clamp(Wc);ev.W=wv.join(', ');
 const gi=D.gate[e.meet];if(gi!==undefined){const exp=4/Math.max(8,+e.dusu||field.length);const inside=+e.chulNo<=4;c.G=clamp(50+(inside?1:-1)*(gi-exp)*100);ev.G=`${e.meet} 최근 1착마 중 1~4번 ${Math.round(gi*100)}% (기대치 ${Math.round(exp*100)}%), 이 말 ${e.chulNo}번`}else{c.G=50;ev.G='게이트 데이터 없음(중립 50)'}

 const total=Object.keys(W).reduce((a,k)=>a+W[k]*c[k],0)/100;return{total:Math.round(total*10)/10,c,ev,flags}}

<h3>최근 성적</h3><div class="kv"><div><label>최근 30일</label>${j30.sum}</div><div><label>최근 60일 (KRA 집계)</label>${p.raceCnttsum?`${p.raceCnttsum}전 ${p.firstCnt}승 · 승률 ${p.winRateTsum}% · 복승률 ${p.quRateTsum}%`:NA}</div>
<div><label>최근 1년</label>${i.rcCntY!==undefined?yr(i.ord1CntY,i.ord2CntY,i.ord3CntY,i.rcCntY):r.rcCntY?`${r.rcCntY}전 · 승률 ${r.winRateY}% · 복승률 ${r.qnlRateY}%`:NA}</div><div><label>통산</label>${i.rcCntT!==undefined?yr(i.ord1CntT,i.ord2CntT,i.ord3CntT,i.rcCntT):r.rcCntT?`${r.rcCntT}전 · 승률 ${r.winRateT}%`:NA}</div></div>
${j30.list}<div style="margin-top:8px">기수 별점 ${starH(jkStar(jk))}</div><h3>이 말과의 호흡</h3><div class="card">${!hr?'<span class="muted">출마표에서 열면 해당 말과의 기록을 보여드려요.</span>':combo.length?`${e.hrName||''} 기승 ${combo.length}전 ${cw}승 · 3착 이내 ${ct}회 (수집 기간)`:NA+' <span class="muted">(수집 기간 내 함께 출전한 기록 없음)</span>'}</div>
<h3>경력</h3><div class="kv"><div><label>데뷔</label>${i.debut?String(i.debut).replace(/(\d{4})(\d\d)(\d\d)/,'$1.$2.$3'):NA}</div><div><label>나이</label>${i.age?i.age+'세':NA}</div><div><label>기본 기승중량</label>${i.wgPart?i.wgPart+'kg':NA}</div><div><label>소속</label>${i.part||NA}</div></div>
<p class="note">출처: 공공데이터포털 한국마사회 기수 정보. "최근 30일"은 현재 제공 API에 없어 표시하지 않아요.</p>`)}
// ---- 지난 분석 적중률: 종료 경주마다 그 경주 이전 기록만으로 RN 순위를 계산해 실제 결과와 비교 ----
function acc(){const R=races();let n=0,w1=0,t1=0,top3in=0,ex3=0,base=0,base3=0;const rows=[];
for(const k in R){const es=R[k],e=es[0];const res=D.results.filter(r=>r.rcDate===e.rcDate&&r.meet===e.meet&&r.rcNo===e.rcNo);if(res.length<3)continue;
const ord={};res.forEach(r=>ord[r.chulNo]=+r.ord);const rk=es.map(x=>({c:x.chulNo,t:rnScore(x,es).total})).sort((a,b)=>b.t-a.t).map(o=>o.c);
n++;const o1=ord[rk[0]];if(o1===1)w1++;if(o1&&o1<=3)t1++;const hit=rk.slice(0,3).filter(c=>ord[c]&&ord[c]<=3).length;top3in+=hit;if(hit===3)ex3++;
const fn=es.length;base+=1/fn;base3+=Math.min(3,fn)/fn;rows.push([k,rk.slice(0,3).map(c=>ord[c]??'-')])}
if(!n)return '<h2>지난 분석 적중률</h2><div class="card muted">아직 결과가 확정된 경주가 없어요.</div>';
const dates=rows.map(r=>r[0].split('|')[0]).sort();
return `<h2>지난 분석 적중률</h2><div class="rnnote">종료된 경주마다 <b>그 경주 이전의 기록만</b>으로 RN 순위를 다시 계산해, 실제 공식 착순과 비교했어요. 좋은 결과만 골라 보여주지 않고 수집된 전 경주를 집계해요. 과거 성적은 미래 결과를 보장하지 않아요.</div>
<div class="kv"><div><label>RN 1위 → 실제 1착</label><span class="acc">${pct(w1,n)}</span><div class="muted">무작위 기대 ${pct(base,n)}</div></div><div><label>RN 1위 → 3착 이내</label><span class="acc">${pct(t1,n)}</span><div class="muted">무작위 기대 ${pct(base3,n)}</div></div>
<div><label>RN 1~3위 중 3착 이내 (평균)</label><span class="acc">${(top3in/n).toFixed(2)}</span><div class="muted">마리 / 3마리</div></div><div><label>RN 1~3위 = 실제 1~3착 (순서 무관)</label><span class="acc">${pct(ex3,n)}</span></div></div>
<p class="note">대상: ${n}개 경주 · ${fd(dates[0])}~${fd(dates[dates.length-1])} · 수집 기간이 짧고, 초반 경주는 이전 기록이 적어 점수가 중립값에 가까워요.</p>
<h3>경주별 기록</h3><div class="card" style="padding:8px;overflow-x:auto"><table><tr><th>경주</th><th>RN1위</th><th>RN2위</th><th>RN3위</th></tr>${rows.sort((a,b)=>b[0].localeCompare(a[0])).slice(0,60).map(([k,o])=>{const[d,m,no]=k.split('|');return `<tr><td><a href="#/race/${encodeURIComponent(k)}">${fd(d)} ${m} ${no}R</a></td>${o.map(x=>`<td>${x}${x!=='-'?'착':''}</td>`).join('')}</tr>`}).join('')}</table></div><p class="note">최근 60경주 표시 · 숫자는 실제 착순</p>`}
// ---- 말 지식 (knowledge/kra-knowledge.md 요약 + 일반 상식) ----
const KN=[['eco','🌱','말의 생태',`<p>말은 초식동물이고 위가 작아서 하루 종일 조금씩 자주 먹어요. 시야가 거의 360°로 넓은 대신 바로 앞과 바로 뒤는 잘 보지 못해요. 무리 생활을 하는 동물이라 겁이 많고 소리와 움직임에 예민해요.</p><p>경주마는 대부분 서서 잠깐씩 졸고, 깊은 잠은 누워서 짧게 자요. 경주 전후 마체중을 재는 이유도 컨디션이 몸무게에 잘 드러나기 때문이에요. 보통 ±10kg 이상 변하면 컨디션 변화 신호로 봐요(통설).</p><p class="note">일반 상식 요약 · 수의학적 판단이 아니에요.</p>`],
['breed','🧬','품종·혈통',`<p><b>더러브렛</b>은 서울·부산경남 경주에 나서는 경주용 순혈 품종이에요. 제주에서는 <b>제주마</b>와 더러브렛·제주마 교잡종인 <b>한라마</b>(체고 137cm 이하)가 달려요.</p><p>산지는 국산과 외산으로 나눠요. 혈통은 <b>부마</b>(아버지), <b>모마</b>(어머니), <b>모부마</b>(어머니의 아버지)를 보고, 씨수말 계열에 따라 거리 적성이 갈린다고들 해요(통설). 성별은 수말·암말·거세마(거)로 표시해요.</p><p>모든 말은 1월 1일에 한 살씩 나이를 먹어요.</p>`],
['track','🏟️','거리·주로',`<p>국내 경마장은 모두 <b>모래 주로</b>예요. 서울은 외주로 1,800m·내주로 1,600m, 결승 직선 450m, 폭 25m(직선 30m), 모래 평균 8cm예요(KRA 공개 자료).</p><p><b>함수율</b>(모래 속 수분)은 1~5% 건조, 6~9% 양호, 10~14% 다습, 15~19% 포화, 20% 이상 불량으로 표시해요. 물기가 많으면 주로가 단단해져 기록이 빨라지는 경향이 있다고 알려져 있어요(업계 통설).</p><p>출발 직후 코너까지 거리가 짧은 코스는 안쪽 게이트가 유리하다는 말이 있어요. 레이스노트는 이런 통설을 실제 데이터로 확인해 보여드려요.</p>`],
['grade','🏅','등급·레이팅',`<p><b>레이팅</b>은 말의 능력을 숫자로 나타낸 값이에요. <b>레이팅 1점 = 부담중량 0.5kg</b>이고, 기준마보다 1마신 앞서면 대략 1점 올라요.</p><p>서울·부산경남: 1등급 81 이상, 2등급 80 이하, 3등급 65 이하, 4등급 50 이하, 5등급 35 이하, 6등급은 레이팅 없음.</p><p><b>부담중량</b>은 마령중량(나이 기준), 별정(조건별), 핸디캡(능력별 차등)이 있어요. 핸디캡 최고중량은 1등급 60kg부터 5등급 57kg, 최저는 51kg이에요. 암말은 2kg 감량을 받아요.</p><p class="note">출처: 한국마사회 2026 경마시행계획·레이팅 안내 요약</p>`],
['words','📖','용어 사전',null]];
const WORDS=[['출마표','경주별 출전마·기수·부담중량을 정리한 표'],['게이트(마번)','출발할 때 들어가는 칸 번호'],['마신','말 한 마리 몸길이 단위 착차(약 2.4m)'],['착차','도착할 때 거리 차이(코·머리·목·마신)'],['외주로/내주로','바깥쪽·안쪽 경주로'],['펄롱','200m 단위'],['S1F/G1F','초반 200m / 마지막 200m 기록'],['G3F','마지막 600m 기록'],['함수율','주로 모래의 수분 비율'],['레이팅','능력을 나타내는 숫자'],['승급/강급','등급이 오르거나 내리는 것'],['부담중량','말이 지는 무게(기수·장구 포함)'],['핸디캡','레이팅에 따라 중량을 차등하는 방식'],['별정','정해진 조건에 따른 중량'],['마령중량','나이에 따른 기준 중량'],['감량기수(견습)','부담 감량 혜택을 받는 기수'],['마체중','경주 전에 잰 말의 체중'],['조교사','말의 훈련을 책임지는 사람'],['마방','조교사가 운영하는 마구간 단위'],['조교','훈련'],['신마','처음 출전하는 말'],['휴양','장기간 쉬는 것'],['선행','앞에서 달리는 전법'],['선입','앞 무리에 붙어 가는 전법'],['추입','뒤에서 막판에 치고 나오는 전법'],['페이스','구간별 속도 흐름'],['진로방해','다른 말의 진로를 막는 반칙'],['강착/실격','반칙으로 순위를 내리거나 없애는 것'],['사진판정','근소한 차이를 사진으로 가리는 것'],['대상경주','최상위 경주(G1~G3)'],['장구','블링커·혀끈 같은 장비'],['교차경주','다른 경마장 경주를 중계하는 것']];
function know(a){const t=KN.find(x=>x[0]===a);if(!t)return `<h2>말 지식</h2><p class="muted" style="margin-bottom:10px">처음이어도 괜찮아요. 하나씩 가볍게 읽어보세요.</p><div class="tiles">${KN.map(([id,ic,n])=>`<a class="tile" href="#/know/${id}"><span>${ic}</span><b>${n}</b></a>`).join('')}<a class="tile" href="#/guide"><span>📘</span><b>입문 가이드</b></a></div>`;
return `<a href="#/know">← 말 지식</a><h2>${t[1]} ${t[2]}</h2><div class="card">${t[3]||`<input placeholder="용어 검색" oninput="document.querySelectorAll('.wd').forEach(r=>r.style.display=r.textContent.includes(this.value)?'':'none')"><table style="margin-top:8px">${WORDS.map(([w,d])=>`<tr class="wd"><td><b>${w}</b></td><td>${d}</td></tr>`).join('')}</table>`}</div>`}
function route(){closeSheet();const h=location.hash.slice(2)||'';const[p,a]=[h.split('/')[0],decodeURIComponent(h.split('/').slice(1).join('/'))];
const v={'':home,race:()=>race(a),jcards:jgal,hcards:hgal,horse:()=>horse(a),fav:favs,search,guide,pass,terms,method,know:()=>know(a),acc,races:homeRaces}[p]||home;$('#view').innerHTML=v();
document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.dataset.r===({races:'home',race:'home'}[p]||p||'home')));if(p==='pass')initPay().catch(e=>{$('#payment-method').innerHTML='<p class="muted">결제 위젯을 불러오지 못했습니다: '+e.message+'</p>'})}
addEventListener('hashchange',()=>{route();scrollTo(0,0)});
const unc=k=>{if(k._fmt!=='cols1')return k;const o={};for(const x in k){const v=k[x];o[x]=v&&v.cols?v.rows.map(r=>Object.fromEntries(v.cols.map((c,i)=>[c,r[i]]).filter(p=>p[1]!==null))):v}return o};
// 표시 이름 정리: 기수 감량 "(-4)", 말 산지 "[영남]" 접두어 제거 → jkTag/hrTag로 보관
const PFX=/^\s*(\([^)]*\)|\[[^\]]*\])\s*/;const cleanNames=k=>{for(const x in k){const v=k[x];if(Array.isArray(v))v.forEach(o=>{if(!o||typeof o!=='object')return;for(const f of ['hrName','jkName','jkBefName','jkAftName']){const m=typeof o[f]==='string'&&o[f].match(PFX);if(m){o[f.startsWith('hr')?'hrTag':'jkTag']=m[1];o[f]=o[f].replace(PFX,'')}}})}return k};
fetch('data/app.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>fetch('data/kra.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()})).then(unc).then(cleanNames).then(k=>{AN=k.analysts||null;JKR=k.jkRecent||{};PEDM=k.ped||{};RISE=k.rising||[];JKP=k.jkPriority||[];HART=Object.fromEntries((k.horseArt||[]).map(h=>[h,1]));if(!k.entries||!k.entries.length)throw 0;GR=k.grades||{};D=normKra(k)})
.catch(()=>fetch('data/sample.json').then(r=>r.json()).then(j=>{D=normSample(j)})).then(()=>{$('#srcb').innerHTML=srcBanner();calc();route();gate()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
