<div class="foot">레이스노트는 경마 기록·통계 정보 서비스이며 마권 구매·베팅 기능을 제공하지 않습니다. 모든 지표는 참고용이며 결과를 보장하지 않습니다. 만 19세 이상 이용. 본 서비스는 한국마사회의 공식 서비스가 아닙니다.<br>도박 문제 상담: 한국도박문제예방치유원 헬프라인 <b>국번 없이 1336</b> (무료, 365일 09:00~22:00) · <a href="https://www.kcgp.or.kr" target="_blank" rel="noopener">kcgp.or.kr</a> · <a href="#/terms">약관·고지</a></div>

<script>
const $=s=>document.querySelector(s);let D;const FK='rn_fav',AK='rn_age19';
const fav=()=>JSON.parse(localStorage.getItem(FK)||'[]');
function toggleFav(no){let f=fav();f=f.includes(no)?f.filter(x=>x!==no):[...f,no];localStorage.setItem(FK,JSON.stringify(f));route()}
const fd=d=>`${+String(d).slice(4,6)}/${+String(d).slice(6)}`;
const sec=t=>{const[m,s]=String(t).split(':');return s===undefined?+m:+m*60+ +s};
const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n};
const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
const dayShort=d=>String(d||'').replace('요일','');
let SI={},HSI={};
// ---- 데이터 정규화: 실데이터(kra.json) 또는 예시(sample.json)를 같은 구조로 ----
function normKra(k){
  const E=k.entries.map(e=>({...e,meet:e.meet,rcDate:String(e.rcDate),rcNo:String(e.rcNo),chulNo:String(e.chulNo),rcDay:dayShort(e.rcDay),
    age:String(e.age).includes('세')?e.age:e.age+'세',stTime:(String(e.stTime).match(/\d{1,2}:\d{2}/)||[''])[0],rating:e.rating,rcDist:String(e.rcDist)}));
  const dist={};E.forEach(e=>dist[[e.rcDate,e.meet,e.rcNo].join('|')]=e.rcDist);
  const trk={};(k.track||[]).forEach(t=>trk[[t.rcDate,t.meet,t.rcNo].join('|')]=t);
  const R=(k.detail||[]).filter(r=>+r.stOrd>0&&/\d/.test(r.rcTime)).map(r=>{const key=[r.rcDate,r.meet,r.rcNo].join('|');const t=trk[key]||{};
    return {meet:r.meet,rcDate:String(r.rcDate),rcNo:String(r.rcNo),rcDist:dist[key]||'',track:t.track||'-',water:t.waterPercent,ord:String(r.stOrd),chulNo:String(r.chulNo),
      hrNo:r.hrNo,hrName:r.hrName,age:r.age,sex:r.sex,wgBudam:r.wgBudam,jkNo:r.jkNo,jkName:r.jkName,trNo:r.trNo,trName:r.trName,wgHr:`${r.wgHr}(${+r.df>0?'+':''}${r.df})`,wgNum:+r.wgHr,df:+r.df,rcTime:r.rcTime,hrTool:r.hrTool||'-'}}).filter(r=>r.rcDist);
  const H={};E.forEach(e=>H[e.hrNo]={hrNo:e.hrNo,hrName:e.hrName,prdCtyNm:e.prd,sex:e.sex,age:e.age,owName:e.owName});
  const jk={};(k.jockeyPeriod||[]).forEach(j=>jk[j.jkNo]={win:+j.winRateTsum,qu:+j.quRateTsum,n:+j.raceCnttsum,src:'최근60일'});
  (k.jockeyResult||[]).forEach(j=>{if(!jk[j.jkNo]&&+j.rcCntY>0)jk[j.jkNo]={win:+j.winRateY,qu:+j.qnlRateY,n:+j.rcCntY,src:'최근1년'}});
  const wt={};(k.weight||[]).forEach(w=>wt[[w.rcDate,w.meet,w.rcNo,w.chulNo].join('|')]={wg:w.wgHr,diff:+w.wgHrDiff,recent:w.recentRcDate});
  const chg={};(k.jockeyChange||[]).forEach(c=>chg[[c.rcDate,c.meet,c.rcNo,c.chulNo].join('|')]=c);
  return {source:'kra',updatedAt:k.updatedAt,entries:E,results:R,horses:Object.values(H),jk,wt,chg}}
function normSample(s){return {...s,source:'sample',jk:{},wt:{},chg:{}}}
function calc(){const g={};D.results.forEach(r=>{const k=r.meet+r.rcDist;(g[k]=g[k]||[]).push(sec(r.rcTime))});
const st={};for(const k in g){const a=g[k],m=a.reduce((x,y)=>x+y)/a.length,sd=Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)||1;st[k]=[m,sd]}
D.results.forEach(r=>{const[m,sd]=st[r.meet+r.rcDist];const adj=['포화','불량'].includes(r.track)?.4:0;r.si=Math.round(80+(m-sec(r.rcTime)+adj)/sd*10)});
const by={};D.results.forEach(r=>(by[r.hrNo]=by[r.hrNo]||[]).push(r));
for(const h in by){by[h].sort((a,b)=>b.rcDate.localeCompare(a.rcDate));HSI[h]=Math.max(...by[h].slice(0,3).map(r=>r.si))}SI=by;
// 게이트 경향: 경마장별 1착마 중 안쪽(1~4번) 비율
D.gate={};const cnt={};D.results.forEach(r=>{if(r.ord==='1'){const c=cnt[r.meet]=cnt[r.meet]||{w:0,i:0};c.w++;if(+r.chulNo<=4)c.i++}});
for(const m in cnt)D.gate[m]=cnt[m].i/cnt[m].w}
const races=()=>{const m={};D.entries.forEach(e=>{const k=[e.rcDate,e.meet,e.rcNo].join('|');(m[k]=m[k]||[]).push(e)});for(const k in m)m[k].sort((a,b)=>a.chulNo-b.chulNo);return m};
// ---- RN-Score v0 (규칙 기반, 참고용) ----
const W={S:30,R:15,D:10,P:5,J:10,C:5,T:5,W:10,G:10};
const WN={S:'능력(속도지수)',R:'레이팅·중량',D:'거리·주로 적성',P:'혈통 적성',J:'기수',C:'기수×말 조합',T:'조교사',W:'컨디션(마체중·휴양)',G:'게이트 경향'};
function rate(rs,f){const n=rs.length,k=rs.filter(f).length;return{n,k,r:(k+0.9)/(n+3)}}
function rnScore(e,field){const hist=(SI[e.hrNo]||[]).filter(r=>r.rcDate<e.rcDate);const c={},ev={},flags=[];
 const l3=hist.slice(0,3);if(l3.length){const w=[.5,.3,.2].slice(0,l3.length),ws=w.reduce((a,b)=>a+b);const v=l3.reduce((a,r,i)=>a+r.si*w[i],0)/ws;c.S=clamp(50+(v-80)*2.5);ev.S=`최근 ${l3.length}회 지수 ${l3.map(r=>r.si).join('/')}`}else{c.S=50;ev.S='이전 기록 없음(중립 50)'}
 const rt=num(e.rating),avg=field.map(x=>num(x.rating)).filter(x=>x!==null);let R=50,rv=[];
 if(rt!==null&&avg.length){const a=avg.reduce((x,y)=>x+y)/avg.length;R+= (rt-a)*2;rv.push(`레이팅 ${rt} (경주 평균 ${a.toFixed(0)})`)}else rv.push('레이팅 없음');
 if(l3[0]&&num(e.wgBudam)!==null&&num(l3[0].wgBudam)!==null){const d=num(e.wgBudam)-num(l3[0].wgBudam);R-=d*2;rv.push(`부담중량 ${d>=0?'+':''}${d}kg`)}
 c.R=clamp(R);ev.R=rv.join(', ');
 const sd=hist.filter(r=>Math.abs(+r.rcDist-+e.rcDist)<=200);const dr=rate(sd,r=>+r.ord<=3);c.D=clamp(dr.r/0.6*100);ev.D=`비슷한 거리(±200m) ${dr.n}전 중 3착 이내 ${dr.k}회`;
 c.P=50;ev.P='혈통 데이터 미연동(중립 50)';
 const j=D.jk[e.jkNo];if(j){c.J=clamp(20+j.win*2+j.qu*0.6);ev.J=`${e.jkName} ${j.src} 승률 ${j.win}% · 복승률 ${j.qu}% (${j.n}전)`}else{c.J=50;ev.J='기수 성적 데이터 없음(중립 50)'}
 const cb=hist.filter(r=>r.jkNo&&r.jkNo===e.jkNo);if(cb.length>=3){const x=rate(cb,r=>+r.ord<=3);c.C=clamp(x.r/0.6*100);ev.C=`이 기수와 ${x.n}전 3착 이내 ${x.k}회`}else{c.C=50;ev.C=`조합 표본 ${cb.length}회(<3, 중립 50)`}
 const tr=D.results.filter(r=>r.trNo&&r.trNo===e.trNo&&r.rcDate<e.rcDate);if(tr.length>=5){const x=rate(tr,r=>+r.ord<=3);c.T=clamp(x.r/0.6*100);ev.T=`수집 기간 ${x.n}전 3착 이내 ${x.k}회(자체 집계)`}else{c.T=50;ev.T='표본 부족(중립 50)'}
 const w=D.wt[[e.rcDate,e.meet,e.rcNo,e.chulNo].join('|')];let Wc=65,wv=[];
 if(w){const a=Math.abs(w.diff);Wc=a>=10?35:a>=6?55:70;wv.push(`마체중 ${w.wg}kg (${w.diff>0?'+':''}${w.diff})`);if(a>=10)flags.push('마체중 ±10kg 이상')}else wv.push('마체중 정보 없음');
 if(l3[0]){const gap=(new Date(e.rcDate.replace(/(\d{4})(\d\d)(\d\d)/,'$1-$2-$3'))-new Date(l3[0].rcDate.replace(/(\d{4})(\d\d)(\d\d)/,'$1-$2-$3')))/864e5;if(gap>90){Wc-=20;flags.push(`휴양 후 복귀(${gap|0}일)`)}wv.push(`직전 출전 ${gap|0}일 전`)}
 c.W=clamp(Wc);ev.W=wv.join(', ');
 const gi=D.gate[e.meet];if(gi!==undefined){const exp=4/Math.max(8,+e.dusu||field.length);const inside=+e.chulNo<=4;c.G=clamp(50+(inside?1:-1)*(gi-exp)*100);ev.G=`${e.meet} 최근 1착마 중 1~4번 ${Math.round(gi*100)}% (기대치 ${Math.round(exp*100)}%), 이 말 ${e.chulNo}번`}else{c.G=50;ev.G='게이트 데이터 없음(중립 50)'}
 const ch=D.chg[[e.rcDate,e.meet,e.rcNo,e.chulNo].join('|')];if(ch)flags.push(`기수 변경: ${ch.jkBefName}→${ch.jkAftName}${ch.reason?' ('+ch.reason+')':''}`);
 if(l3[0]&&l3[0].hrTool&&l3[1]&&l3[1].hrTool&&l3[0].hrTool!==l3[1].hrTool)flags.push('장구 변경 이력');
 const total=Object.keys(W).reduce((a,k)=>a+W[k]*c[k],0)/100;return{total:Math.round(total*10)/10,c,ev,flags}}
function srcBanner(){return D.source==='kra'?`<div class="banner ok">출처: 공공데이터포털 한국마사회 제공 데이터 · 업데이트 ${new Date(D.updatedAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})} KST</div>`:'<div class="banner">⚠️ 예시 데이터 — 실제 경주·마필·인물이 아닌 가상 데이터입니다</div>'}
function home(){const R=races();const days={};Object.keys(R).forEach(k=>{const[d,m]=k.split('|');((days[d]=days[d]||{})[m]=days[d][m]||[]).push(k)});
const ds=Object.keys(days).sort().reverse().slice(0,D.source==='kra'?4:9);const today=new Date(Date.now()+9*36e5).toISOString().slice(0,10).replaceAll('-','');
let h=`<h2>${D.source==='kra'?'최근·예정 경주':'이번 주 경주'}</h2>`;if(D.source==='kra'&&!ds.some(d=>d>=today))h+='<p class="muted">이번 주 출마표가 아직 공개되지 않아 최근 경주일을 보여드립니다. 지난 경주의 RN-Score는 해당 경주 이전 기록만으로 계산합니다.</p>';
for(const d of ds){const e0=R[Object.values(days[d])[0][0]][0];h+=`<h3>${fd(d)} (${e0.rcDay}) ${d<today?'<span class="chip">종료</span>':''}</h3>`;
for(const m in days[d]){days[d][m].sort((a,b)=>a.split('|')[2]-b.split('|')[2]);h+=`<div class="card"><div class="row"><b>${m}</b><span class="muted">${days[d][m].length}개 경주</span></div><div style="margin-top:8px">`+
days[d][m].map(k=>{const e=R[k][0];return `<a class="chip" href="#/race/${encodeURIComponent(k)}">${e.rcNo}R · ${e.rcDist}m${e.stTime?' · '+e.stTime:''}</a>`}).join('')+'</div></div>'}}
h+=`<h3>최근 트랙 경향</h3>`+bias();return h}
function bias(){const m={};D.results.forEach(r=>{const k=r.meet;m[k]=m[k]||{w:0,f:0,i:0,hasF:false};if(r.ord==='1'){m[k].w++;if(r.sjS1fOrd!==undefined){m[k].hasF=true;if(+r.sjS1fOrd<=3)m[k].f++}if(+r.chulNo<=4)m[k].i++}});
return Object.entries(m).map(([k,v])=>`<div class="card"><b>${k}</b> <span class="muted">수집된 ${v.w}개 경주 1착마 기준</span>
${v.hasF?`<div class="muted" style="margin-top:8px">초반 3위 이내(선행) 비율 ${Math.round(v.f/v.w*100)}%</div><div class="bar"><i style="width:${v.f/v.w*100}%"></i></div>`:''}
<div class="muted" style="margin-top:6px">안쪽 출주번호(1~4) 비율 ${Math.round(v.i/v.w*100)}%</div><div class="bar"><i style="width:${v.i/v.w*100}%"></i></div></div>`).join('')+'<p class="note">트랙 경향은 과거 기록의 단순 집계이며 향후 결과를 예측·보장하지 않습니다.'+(D.source==='kra'?' 선행 비율은 경주성적정보 API 승인 후 제공됩니다.':'')+'</p>'}
let OPEN=null;
function race(k){const es=races()[k];if(!es)return'<p>경주를 찾을 수 없습니다.</p>';const e=es[0];const f=fav();
const sc=es.map(x=>({x,s:rnScore(x,es)}));const rank=[...sc].sort((a,b)=>b.s.total-a.s.total).map(o=>o.x.chulNo);
